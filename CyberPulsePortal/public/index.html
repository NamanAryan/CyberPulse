<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - CyberPulse Portal</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
    <!-- Header Bar -->
    <header class="header-bar">
        <div class="container header-container">
            <div class="brand">
                <a href="/index.html" class="brand-link" aria-label="Go to home page">
                    <i class="bi bi-cpu-fill brand-icon"></i>
                    <span class="brand-name">CyberPulse</span>
                </a>
                <span class="brand-divider">/</span>
                <span class="brand-page">Portal</span>
            </div>
            <div class="header-right">
                <span class="date-display" id="currentDate">-- --- ----</span>
                <button class="btn-refresh" id="refreshBtn" title="Check for updates">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Navigation (rendered by portal-shell.js) -->
    <nav data-portal-nav data-active="home"></nav>

    <!-- Page Banner (rendered by portal-shell.js) -->
    <div data-portal-banner
         data-title="Home"
         data-tagline="Your Daily Pulse of People, Quality and News"></div>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="container portal-container">

            <div class="empty-state" id="emptyState" style="display: none;">
                <i class="bi bi-journal-x empty-icon"></i>
                <h3>No Announcements Found</h3>
                <p>There are no active announcements to display.</p>
            </div>

            <div class="portal-dashboard">
                <!-- 1. Announcements -->
                <section class="carousel-section" id="carouselSection" style="display: none;">
                    <div class="carousel-box">
                        <div class="carousel-header">
                            <span class="carousel-header-title">ANNOUNCEMENTS</span>
                            <a href="all.html" class="carousel-header-arrow" id="carouselHeaderArrow" aria-label="View all announcements">&rarr;</a>
                        </div>
                        <div class="carousel-track-wrapper"><div class="carousel-track" id="carouselTrack"></div></div>
                        <div class="carousel-footer"><div class="carousel-indicators" id="carouselIndicators"></div></div>
                    </div>
                </section>

                <!-- 2. Photos & Video Gallery -->
                <section class="media-gallery-section" id="mediaGallerySection">
                    <div class="media-gallery-header">
                        <h2 class="section-title text-primary">PHOTOS &amp; VIDEO GALLERY</h2>
                        <div class="media-tabs">
                            <button class="media-tab active" data-tab="photos">Photos</button>
                            <button class="media-tab" data-tab="videos">Videos</button>
                        </div>
                    </div>
                    <div class="media-carousel-container">
                        <button class="nav-btn prev-btn" id="mediaPrevBtn" aria-label="Previous media"><i class="bi bi-chevron-left"></i></button>
                        <div class="media-track-wrapper"><div class="media-track" id="mediaGalleryTrack"></div></div>
                        <button class="nav-btn next-btn" id="mediaNextBtn" aria-label="Next media"><i class="bi bi-chevron-right"></i></button>
                    </div>
                </section>

                <!-- 3. News and Articles -->
                <section class="news-section-box" id="newsSection" style="display: none;">
                    <div class="portal-card-header">
                        <h2 class="section-title text-primary">NEWS &amp; ARTICLES</h2>
                        <a href="all-news.html" class="carousel-header-arrow" aria-label="View all news articles">&rarr;</a>
                    </div>
                    <div class="news-articles-list" id="newsArticlesList"></div>
                </section>

                <!-- 4. Health Tip -->
                <section class="health-tip-section-box" id="healthTipSection" style="display: none;">
                    <div class="portal-card-header">
                        <h2 class="section-title text-primary">HEALTH TIP</h2>
                    </div>
                    <div id="healthTipContent">
                        <img id="healthTipImgDisplay" src="" alt="Health Tip" />
                        <div id="healthTipTextDisplay"></div>
                    </div>
                </section>
            </div>

        </div>
    </main>


    <!-- Media Viewer Overlay -->
    <div class="viewer-overlay" id="mediaViewer">
        <button class="viewer-close" id="viewerClose"><i class="bi bi-x-lg"></i></button>
        <img id="viewerImg" src="" alt="" style="display:none;">
        <video id="viewerVid" controls style="display:none;"></video>
        <div class="viewer-title" id="viewerTitle"></div>
    </div>

    <!-- Scripts -->
    <script src="js/portal-shell.js?v=1"></script>
    <script src="js/app.js?v=10"></script>
</body>
</html>

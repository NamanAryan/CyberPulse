<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Portal Files - CyberPulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* === Page-specific styles for the HR Files page === */
        .page-title-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .page-title-area h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            color: var(--purple-900);
            margin: 0;
            font-weight: 800;
        }
        .file-count-badge {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 14px;
        }

        /* --- Tab Bar --- */
        .tab-bar {
            display: flex;
            gap: 4px;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 5px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }
        .tab-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border: none;
            background: transparent;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn:hover {
            background: var(--gray-50);
            color: var(--text-dark);
        }
        .tab-btn.active {
            background: var(--purple-900);
            color: var(--white);
            box-shadow: var(--shadow-sm);
        }
        .tab-btn .tab-count {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 1px 8px;
            font-size: 11px;
            font-weight: 700;
        }
        .tab-btn:not(.active) .tab-count {
            background: var(--gray-100);
            color: var(--text-muted);
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* --- Document List Items --- */
        .doc-card {
            display: flex;
            gap: 16px;
            align-items: center;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 16px 20px;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }
        .doc-card:hover {
            border-color: var(--purple-300);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        .doc-card .doc-icon {
            font-size: 32px;
            flex-shrink: 0;
            width: 48px;
            text-align: center;
        }
        .doc-card .doc-info {
            flex-grow: 1;
            min-width: 0;
        }
        .doc-card .doc-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-decoration: none;
            display: block;
        }
        .doc-card .doc-name:hover {
            color: var(--purple-600);
        }
        .doc-card .doc-meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* --- Media Grid --- */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .media-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            overflow: hidden;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
        }
        .media-card:hover {
            border-color: var(--purple-300);
            box-shadow: var(--shadow-lg);
            transform: translateY(-3px);
        }
        .media-thumb {
            position: relative;
            width: 100%;
            height: 250px;
            background: var(--gray-100);
            overflow: hidden;
        }
        .media-thumb img,
        .media-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .media-thumb .play-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: rgba(255,255,255,0.92);
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            pointer-events: none;
            transition: transform 0.2s;
        }
        .media-card:hover .play-badge {
            transform: translate(-50%, -50%) scale(1.1);
        }
        .media-card-body {
            padding: 12px 14px;
        }
        .media-card-body .media-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .media-card-body .media-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
        }


        /* --- Empty / Error States --- */
        .empty-panel {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-panel i {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.4;
        }
        .empty-panel h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-600);
            margin-bottom: 4px;
        }
        .empty-panel p {
            font-size: 14px;
        }

        /* --- Documents list spacing --- */
        .doc-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media (max-width: 640px) {
            .media-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
            .tab-btn {
                font-size: 12px;
                padding: 8px 10px;
                gap: 4px;
            }
            .tab-btn i { display: none; }
        }
    </style>
</head>
<body>
    <!-- Header Bar -->
    <header class="header-bar">
        <div class="container header-container">
            <div class="brand">
                <a href="/index.html" class="brand-link" aria-label="Go to home page">
                    <i class="bi bi-cpu-fill brand-icon"></i>
                    <span class="brand-name">CyberPulse</span>
                </a>
                <span class="brand-divider">/</span>
                <span class="brand-page">Portal</span>
            </div>
            <div class="header-right">
                <span class="date-display" id="currentDate">-- --- ----</span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="container" style="max-width: 960px;">
            
            <a href="/hr-connect.html" class="btn-back" style="margin-top: 20px;">
                <i class="bi bi-arrow-left"></i> Back to HR Connect
            </a>
            
            <div class="page-title-area">
                <h1>HR Portal Files</h1>
                <span class="file-count-badge" id="documentCount">Loading...</span>
            </div>

            <!-- Tab Bar -->
            <div class="tab-bar" id="tabBar">
                <button class="tab-btn active" data-tab="docs">
                    <i class="bi bi-file-earmark-text"></i> Documents <span class="tab-count" id="countDocs">0</span>
                </button>
                <button class="tab-btn" data-tab="media">
                    <i class="bi bi-images"></i> Media <span class="tab-count" id="countMedia">0</span>
                </button>
            </div>

            <!-- Loading State -->
            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <p>Loading files...</p>
            </div>

            <!-- Tab Panes -->
            <div class="tab-pane active" id="pane-docs"></div>
            <div class="tab-pane" id="pane-media"></div>

            <!-- Pagination -->
            <div class="pagination-controls" id="paginationControls" style="display: none;"></div>

        </div>
    </main>

    <!-- Media Viewer Overlay -->
    <div class="viewer-overlay" id="mediaViewer">
        <button class="viewer-close" id="viewerClose"><i class="bi bi-x-lg"></i></button>
        <img id="viewerImg" src="" alt="" style="display:none;">
        <video id="viewerVid" controls style="display:none;"></video>
        <div class="viewer-title" id="viewerTitle"></div>
    </div>

    <script src="js/all-documents.js"></script>
</body>
</html>

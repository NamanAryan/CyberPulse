<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All News & Articles - CyberPulse Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header Bar -->
    <header class="header-bar">
        <div class="container header-container">
            <div class="brand">
                <a href="/index.html" class="brand-link" aria-label="Go to home page">
                    <i class="bi bi-cpu-fill brand-icon"></i>
                    <span class="brand-name">CyberPulse</span>
                </a>
                <span class="brand-divider">/</span>
                <span class="brand-page">Portal</span>
            </div>
            <div class="header-right">
                <span class="date-display" id="currentDate">-- --- ----</span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="container all-news-container">
            
            <a href="index.html" class="btn-back" style="margin-top: 20px;">
                <i class="bi bi-arrow-left"></i> Back to Feed
            </a>
            
            <div class="all-news-toolbar">
                <h1>News &amp; Articles</h1>
                <span id="newsCount">0 items</span>
            </div>

            <!-- Loading State -->
            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <p>Loading news articles...</p>
            </div>
            
            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <i class="bi bi-journal-x empty-icon"></i>
                <h3>No News Articles Found</h3>
                <p>There are no news articles currently available.</p>
            </div>

            <div class="all-news-table-header" aria-hidden="true">
                <span>Preview</span>
                <span>Type</span>
                <span>Headline</span>
                <span>Date</span>
            </div>
            <div class="all-news-grid" id="newsList" style="display: none;">
                <!-- Article rows will be injected here -->
            </div>

            <!-- Pagination -->
            <div class="pagination-controls" id="paginationControls" style="display: none;">
            </div>

        </div>
    </main>

    <script src="js/all-news.js"></script>
</body>
</html>
